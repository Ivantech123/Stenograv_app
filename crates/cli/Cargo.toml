[package]
name = "stenograf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Стенограф из командной строки"

[[bin]]
name = "stenograf"
path = "src/main.rs"

[features]
gpu = ["stenograf-core/gpu"]

[dependencies]
stenograf-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
